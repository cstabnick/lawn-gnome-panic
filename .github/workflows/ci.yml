name: Build

# Every PR runs the same build as the Pages deploy (npm ci + npm run site), so a broken lock file or a game that
# fails to type-check shows up on the PR instead of after the merge. Merges to main are rebuilt by pages.yml,
# which runs on every push to main.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same PR cancels the older run.
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run site
