name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

# Every merge to main rebuilds from scratch (PRs are checked by ci.yml). Close merges queue: a running deploy
# finishes, and the newest waiting run replaces older waiting ones, so the last merge is always what ends up live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run site
        env:
          # The matchmaking server on the whale-net cluster (whale-net/argok8s services/lawn-gnome-panic).
          # Any page can still be pointed elsewhere with ?mp=wss://host/ws.
          VITE_MP_URL: wss://gnome.whalenet.app/ws
      # The same build, also served from the cluster at https://gnome.whalenet.app (nginx, deploy/site.Dockerfile).
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/site.Dockerfile
          push: true
          tags: |
            ghcr.io/cstabnick/lawn-gnome-site:latest
            ghcr.io/cstabnick/lawn-gnome-site:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
