name: Publish platform service image

# Tests the platform service (Go, packages/platform-server) against a real Postgres and pushes its image to GHCR.
# The whale-net cluster runs it (whale-net/argok8s services/lawn-gnome-panic): argocd-image-updater follows
# :latest by digest and rolls the pod.
on:
  push:
    branches: [main]
    paths:
      - packages/platform-server/**
      - proto/**
      - .github/workflows/platform.yml
  pull_request:
    paths:
      - packages/platform-server/**
      - proto/**
      - .github/workflows/platform.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: packages/platform-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/platform-server/go.mod
          cache-dependency-path: packages/platform-server/go.sum
      - run: go vet ./...
      - run: go test -count=1 ./...
        env:
          PLATFORM_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      - if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: packages/platform-server
          push: true
          tags: |
            ghcr.io/cstabnick/lawn-gnome-platform:latest
            ghcr.io/cstabnick/lawn-gnome-platform:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
