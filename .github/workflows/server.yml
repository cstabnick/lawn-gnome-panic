name: Deploy matchmaking server

on:
  push:
    branches: [main]
    paths:
      - packages/mp-server/**
      - packages/mp/**
      - fly.toml
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -w packages/mp-server
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Builds the Docker image on Fly's builders and rolls it out (bluegreen, see fly.toml).
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
