name: Publish matchmaking server image

# Tests the shared matchmaking server and pushes its image to GHCR. The whale-net cluster runs it
# (whale-net/argok8s services/lawn-gnome-panic): argocd-image-updater follows :latest by digest and rolls the pod.
on:
  push:
    branches: [main]
    paths:
      - packages/mp-server/**
      - packages/mp/**
      - .github/workflows/server.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: server-image
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -w packages/mp-server
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/mp-server/Dockerfile
          push: true
          tags: |
            ghcr.io/cstabnick/lawn-gnome-mm:latest
            ghcr.io/cstabnick/lawn-gnome-mm:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
