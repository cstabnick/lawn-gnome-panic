# Severity for the JSON access log (whale-net levels). The log format itself, lawn_json, is written at start by
# /docker-entrypoint.d/30-otel-logging.sh (deploy/otel-logging.sh) when ENABLE_OTEL_LOGGING is on.
map $status $lawn_severity {
  ~^[23] INFO;
  ~^4    WARN;
  default ERROR;
}

# Request correlation for the JSON access log: the ingress's X-Request-ID when it is a plain short token (the same id
# the platform service logs), else nginx's own; the trace id of an incoming W3C traceparent, if any.
map $http_x_request_id $lawn_request_id {
  "~^[A-Za-z0-9-]{1,64}$" $http_x_request_id;
  default                 $request_id;
}
map $http_traceparent $lawn_trace_id {
  "~^00-([0-9a-f]{32})-[0-9a-f]{16}-[0-9a-f]{2}$" $1;
  default                                          "";
}
# The game a request is for: the first path segment (/gnome-golf/assets/x.js -> gnome-golf); empty for the landing page.
map $uri $lawn_game {
  "~^/([A-Za-z0-9_-]+)/" $1;
  default                "";
}

server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Empty unless ENABLE_OTEL_LOGGING is on; then: access_log /dev/stdout lawn_json;
  include /etc/nginx/conf.d/access-log.inc;

  location = /nginx-health { access_log off; return 200 "ok\n"; }

  # Hashed Vite bundles never change; HTML must always be fresh so a deploy shows up at once.
  location ~* /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
  location ~* \.html$ { add_header Cache-Control "no-cache"; }

  location / { try_files $uri $uri/ =404; }
}
