# Fly.io app for the shared matchmaking server (Lawn Gnome Panic, Gnome Front, Gnaft). Deploy: fly deploy (from the repo root).
# Change `app` to a name of your own; it must be unique on Fly.
app = "lawn-gnome-mm"
primary_region = "iad"

[build]
  dockerfile = "packages/mp-server/Dockerfile"

[env]
  PORT = "8080"

# Rolling update without dropping matches: the new machine starts and passes /healthz,
# traffic moves to it, then the old one gets SIGTERM. The server stops matchmaking and
# lets running matches finish for up to kill_timeout (300 s is Fly's maximum).
[deploy]
  strategy = "bluegreen"
  wait_timeout = "10m"

kill_signal = "SIGTERM"
kill_timeout = 300

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: one machine, never stopped by the proxy ($2.19/month).
  # The proxy does not count open WebSockets as load, so its auto-stop stopped the machine 5 minutes
  # after every start mid-match. auto_stop_machines = "off" alone was not enough: machines the proxy
  # itself started (auto_start) were still stopped at 5 minutes (machine events, requested_stop).
  # min_machines_running = 1 is the documented guard that keeps the last machine running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    soft_limit = 400
    hard_limit = 500

  [[http_service.checks]]
    grace_period = "5s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "2s"

# A crash restarts the machine; a clean exit (the SIGTERM drain on deploy) stays stopped.
[[restart]]
  policy = "on-failure"
  retries = 10

# Matchmaking state lives in memory, so run exactly one machine: fly scale count 1
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
