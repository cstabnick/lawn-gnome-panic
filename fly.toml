# Fly.io app for the shared matchmaking server (Lawn Gnome Panic, Gnome Front, Gnaft). Deploy: fly deploy (from the repo root).
# Change `app` to a name of your own; it must be unique on Fly.
app = "lawn-gnome-mm"
primary_region = "iad"

[build]
  dockerfile = "packages/mp-server/Dockerfile"

[env]
  PORT = "8080"
  # The server exits (code 0) after this long with no WebSocket open; see auto_stop_machines below.
  MM_EXIT_WHEN_IDLE_S = "300"

# Rolling update without dropping matches: the new machine starts and passes /healthz,
# traffic moves to it, then the old one gets SIGTERM. The server stops matchmaking and
# lets running matches finish for up to kill_timeout (300 s is Fly's maximum).
[deploy]
  strategy = "bluegreen"
  wait_timeout = "10m"

kill_signal = "SIGTERM"
kill_timeout = 300

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero, done by the server itself: it exits 5 minutes after the last socket closes
  # (MM_EXIT_WHEN_IDLE_S; the restart policy is on-failure, so a clean exit stays stopped) and
  # the proxy starts it again on the next connection (a 1-2 s cold start). Idle costs ~nothing.
  # Not the proxy's own auto-stop: it stopped the machine 5 minutes after every start while
  # players were connected, dropping every match at once.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "connections"
    soft_limit = 400
    hard_limit = 500

  [[http_service.checks]]
    grace_period = "5s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "2s"

# A clean exit (the idle stop above) must leave the machine stopped until the next connection.
[[restart]]
  policy = "on-failure"
  retries = 10

# Matchmaking state lives in memory, so run exactly one machine: fly scale count 1
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
