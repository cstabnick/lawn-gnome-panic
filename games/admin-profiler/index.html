<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Hitch Profiler</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #111316;
        --panel: #1a1d22;
        --panel-2: #20242a;
        --line: #2a2e35;
        --line-2: #363b44;
        --text: #d7dbe2;
        --dim: #8a929e;
        --accent: #f2a93b;
        --blue: #4e9bff;
        --good: #5ccf84;
        --warn: #f2a93b;
        --bad: #e8615a;
        --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, Menlo, monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      body { padding: 0 max(12px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
      a { color: var(--blue); }
      code { font-family: var(--mono); font-size: 11px; }
      button, select { font: inherit; color: inherit; }
      .dim { color: var(--dim); }
      [hidden] { display: none !important; }

      /* toolbar */
      .toolbar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
        margin: 0 calc(-1 * max(12px, env(safe-area-inset-left))) 12px; padding: max(8px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left));
        background: #0c0e10ee; backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
      .brand { display: flex; align-items: center; gap: 8px; font: 700 13px var(--mono); letter-spacing: 0.12em; }
      .logo { width: 14px; height: 14px; background: linear-gradient(90deg, var(--blue) 0 30%, var(--accent) 30% 55%, var(--good) 55% 75%, var(--bad) 75%); border-radius: 2px; }
      .spacer { flex: 1; }
      .field { display: flex; align-items: center; gap: 6px; color: var(--dim); }
      select { background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 4px; min-height: 36px; padding: 0 8px; }
      .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 4px; overflow: hidden; }
      .seg button { background: var(--panel-2); border: 0; border-right: 1px solid var(--line-2); min-width: 44px; min-height: 36px; padding: 0 10px; font-family: var(--mono); cursor: pointer; }
      .seg button:last-child { border-right: 0; }
      .seg button[aria-pressed="true"] { background: var(--blue); color: #08111f; font-weight: 700; }
      .btn { background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 4px; min-height: 36px; padding: 0 12px; cursor: pointer; }
      .btn:hover { border-color: var(--dim); }
      .btn.primary { background: var(--blue); border-color: var(--blue); color: #08111f; font-weight: 700; min-height: 44px; padding: 0 20px; }
      .btn.ghost { background: transparent; }
      .chip { background: #4e9bff22; border: 1px solid #4e9bff88; color: var(--blue); border-radius: 999px; min-height: 30px; padding: 0 10px; cursor: pointer; font-family: var(--mono); font-size: 11px; }
      .who { display: flex; align-items: center; gap: 8px; }
      .badge { font: 700 10px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 7px; border-radius: 3px; background: var(--panel-2); color: var(--dim); border: 1px solid var(--line-2); }
      .badge.demo { background: #f2a93b22; color: var(--accent); border-color: #f2a93b66; }
      .status { font-family: var(--mono); font-size: 11px; color: var(--dim); min-height: 0; }
      .status:empty { display: none; }
      .status.error { color: var(--bad); padding: 8px 0; }

      /* summary numbers */
      .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
      .kpi { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--line-2); border-radius: 4px; padding: 8px 12px; min-width: 0; }
      .kpi.ok { border-left-color: var(--good); }
      .kpi.warn { border-left-color: var(--warn); }
      .kpi.bad { border-left-color: var(--bad); }
      .kpi .k { display: block; font: 700 10px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
      .kpi b { display: block; font: 600 20px var(--mono); margin: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .kpi small { color: var(--dim); font-size: 11px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      /* panels */
      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; margin-bottom: 12px; min-width: 0; }
      .panel > header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel-2); border-radius: 4px 4px 0 0; }
      .panel h2 { margin: 0; font: 700 11px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; }
      .panel > header .dim { font-size: 11px; }
      .split { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 12px; }
      .split > .panel { margin-bottom: 12px; }
      .hint { margin: 0; padding: 6px 12px 8px; color: var(--dim); font-size: 11px; border-top: 1px solid var(--line); }

      .chart { position: relative; height: 320px; }
      .track { position: relative; min-height: 120px; outline: none; cursor: grab; user-select: none; -webkit-user-select: none; }
      .track:active { cursor: grabbing; }
      .track:focus-visible { box-shadow: inset 0 0 0 1px var(--blue); }
      .chart canvas, .track canvas { display: block; }

      .legend { display: flex; flex-wrap: wrap; gap: 4px; }
      .lg { display: inline-flex; align-items: center; gap: 5px; background: transparent; border: 1px solid var(--line-2); border-radius: 3px; padding: 2px 7px; min-height: 26px; font: 11px var(--mono); cursor: pointer; }
      .lg.off { opacity: 0.35; text-decoration: line-through; }
      .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; flex: none; }

      .tip { position: absolute; z-index: 3; pointer-events: none; background: #0b0d10f2; border: 1px solid var(--line-2); border-radius: 4px; padding: 6px 8px; font: 11px/1.45 var(--mono); white-space: pre; max-width: 320px; box-shadow: 0 6px 18px #0008; }
      .tip-head { font-weight: 700; margin-bottom: 2px; }
      .tip-stats { color: var(--dim); margin-bottom: 4px; }
      .tip-row { display: grid; grid-template-columns: 10px 1fr auto; gap: 6px; align-items: center; }
      .tip-row i { width: 8px; height: 8px; border-radius: 2px; }

      .session-head, .frame-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 12px; }
      .frame-head b { font: 600 14px var(--mono); }
      .pill { font: 700 11px var(--mono); padding: 2px 8px; border-radius: 3px; background: #4e9bff22; color: var(--blue); }
      .kind { font: 700 10px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; background: var(--panel-2); }
      .k-frame { color: var(--blue); }
      .k-longtask { color: var(--bad); }
      .k-gap { color: #b07cf0; }
      .k-mark { color: #d9a066; }

      /* tables */
      .table-wrap { max-height: 360px; overflow: auto; -webkit-overflow-scrolling: touch; }
      table { width: 100%; border-collapse: collapse; font-size: 12px; }
      th { position: sticky; top: 0; background: var(--panel-2); text-align: left; font: 700 10px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); padding: 7px 10px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
      th.sortable { cursor: pointer; }
      th.desc::after { content: " ▾"; color: var(--accent); }
      th.asc::after { content: " ▴"; color: var(--accent); }
      td { padding: 0 10px; height: 34px; border-bottom: 1px solid var(--line); white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
      tbody tr { cursor: pointer; }
      tbody tr:hover { background: #ffffff08; }
      tbody tr.sel { background: #4e9bff1f; box-shadow: inset 3px 0 0 var(--blue); }
      tbody tr:focus-visible { outline: 1px solid var(--blue); outline-offset: -1px; }
      .num { text-align: right; font-family: var(--mono); }
      th.num { text-align: right; }
      .name { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); }
      .num-bar { display: inline-flex; align-items: center; justify-content: flex-end; gap: 8px; width: 100%; }
      .bar { display: inline-block; width: 64px; height: 6px; background: #ffffff0d; border-radius: 1px; overflow: hidden; flex: none; }
      .bar i { display: block; height: 100%; }
      .device { color: var(--text); }
      .empty { padding: 16px 12px; color: var(--dim); }

      /* sign-in gate */
      .gate { min-height: 100vh; display: grid; place-items: center; }
      .gate-card { width: min(420px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 24px; }
      .gate-card p { margin: 14px 0; }

      @media (max-width: 900px) {
        .split { grid-template-columns: minmax(0, 1fr); gap: 0; }
        .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .kpis .kpi:last-child { grid-column: 1 / -1; }
        .chart { height: 280px; }
      }
      @media (max-width: 520px) {
        .toolbar { gap: 6px 8px; }
        .brand { width: 100%; }
        .spacer { display: none; }
        .field select { max-width: 52vw; }
        .table-wrap { max-height: 300px; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
