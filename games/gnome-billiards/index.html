<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Gnome Billiards</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      html,body{margin:0;height:100%;overflow:hidden;background:#1b1020;overscroll-behavior:none}
      html,body,#game,#ui{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
      #game{display:block;width:100vw;height:100vh;height:100dvh}
      #ui{position:fixed;inset:0;pointer-events:none;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff}
      #ui button,#ui input{pointer-events:auto;font:inherit}
      .bil-top{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 8px) 12px 0;box-sizing:border-box}
      .bil-seat{display:flex;align-items:center;gap:8px;background:rgba(20,12,30,.72);border:2px solid transparent;border-radius:12px;padding:6px 10px 6px 6px;min-width:0;flex:1 1 0;max-width:46%}
      .bil-seat.active{border-color:#ffd54f;box-shadow:0 0 12px rgba(255,213,79,.5)}
      .bil-seat .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .bil-seat .sub{font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .bil-seat .pips{display:flex;gap:4px;margin-top:4px}
      .bil-seat .pip{width:12px;height:12px;border-radius:50%;background:transparent;border:2px solid rgba(255,255,255,.35);box-sizing:border-box}
      .bil-seat .pip.on{border-color:rgba(0,0,0,.45)}
      .bil-power{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 136px);width:min(260px,60vw);height:16px;background:rgba(0,0,0,.55);border-radius:8px;padding:3px;box-sizing:border-box;display:none;pointer-events:none}
      .bil-power i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#7ed957,#ffd54f 60%,#ff5a5a)}
      .bil-emotes{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 92px);display:none;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 12px;pointer-events:none}
      .bil-emote{min-height:44px;padding:0 12px;font-size:15px}
      .bil-msg{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 58px);text-align:center;font-weight:700;font-size:16px;text-shadow:0 2px 6px #000;pointer-events:none}
      .bil-bar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:space-between;padding:0 12px calc(env(safe-area-inset-bottom) + 8px);flex-wrap:wrap}
      .bil-btn{min-height:44px;min-width:44px;padding:0 12px;border:0;border-radius:10px;background:#3a2a52;color:#fff;font-weight:700;cursor:pointer;font-size:14px}
      .bil-btn.primary{background:#2e8f3e}
      .bil-btn.active{background:#18788a;box-shadow:0 0 0 2px #5ef2ff inset}
      .bil-btn:disabled{opacity:.5}
      .bil-pot{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 74px);background:rgba(20,12,30,.88);border:1px solid #ffd54f;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700;color:#ffd54f;display:none;pointer-events:none;white-space:nowrap}
      .bil-bubble{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 102px);max-width:min(320px,82vw);background:rgba(24,14,38,.92);border:2px solid #ffd54f;border-radius:14px;padding:8px 14px;font-size:14px;line-height:1.3;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.55);display:none;pointer-events:none;z-index:5}
      .bil-bubble.left{left:14px;right:auto;transform:none;text-align:left}
      .bil-bubble.right{left:auto;right:14px;transform:none;text-align:right}
      .bil-bubble .sp{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:#ffd54f;margin-bottom:2px}
      .bil-quips{width:100%;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:4px}
      .bil-quip{min-height:36px;padding:0 10px;font-size:12px;background:#2b1e42;border:1px solid rgba(255,213,79,.35)}
      .bil-fine-row{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 92px);display:none;align-items:center;gap:8px;pointer-events:none}
      .bil-fine-pill{background:rgba(20,12,30,.82);border:1px solid rgba(94,242,255,.55);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700;color:#5ef2ff;white-space:nowrap}
      .bil-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,6,18,.74);padding:12px;box-sizing:border-box;z-index:10}
      .bil-card{background:#2a1c3e;border-radius:16px;padding:18px;max-width:420px;width:100%;max-height:92dvh;overflow-y:auto;box-sizing:border-box;text-align:center;box-shadow:0 10px 30px #000}
      .bil-card h1{margin:0 0 6px;font-size:24px;color:#ffd54f}
      .bil-card p{margin:6px 0 12px;opacity:.9;line-height:1.35;font-size:14px}
      .bil-card .row{display:flex;flex-direction:column;gap:8px;margin-top:8px}
      .bil-card .row.inline{flex-direction:row;gap:8px}
      .bil-card input[type=text],.bil-card input:not([type]){flex:1;min-height:44px;border-radius:10px;border:0;padding:0 10px;background:#fff;color:#111;text-transform:uppercase;letter-spacing:2px;text-align:center;min-width:0}
      .bil-sec{margin-top:12px;text-align:left;background:rgba(14,8,24,.45);border-radius:12px;padding:10px}
      .bil-sec-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:#ffd54f;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
      .bil-pills{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
      .bil-pills.five{grid-template-columns:repeat(3,1fr)}
      .bil-pill{min-height:44px;border:1px solid rgba(255,255,255,.16);border-radius:10px;background:#35254d;color:#fff;font-weight:700;font-size:12px;padding:6px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
      .bil-pill.on{background:#2e8f3e;border-color:#98f5a8}
      .bil-pill.cracked.on{background:#6a1b9a;border-color:#ffd54f}
      .bil-pill small{font-size:10px;opacity:.85;font-weight:600}
      .bil-wager-row{display:flex;align-items:center;gap:8px;margin-top:6px}
      .bil-wager-row input[type=range]{flex:1;min-height:36px;accent-color:#ffd54f;cursor:pointer}
      .bil-wager-presets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
      .bil-chal-list{display:flex;flex-direction:column;gap:8px;margin-top:10px;text-align:left}
      .bil-chal-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(14,8,24,.55);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:10px 12px;cursor:pointer;color:#fff;text-align:left;min-height:56px}
      .bil-chal-item.done{border-color:#7ed957}
      .bil-chal-item .ttl{font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px}
      .bil-chal-item .dsc{font-size:12px;opacity:.82;margin-top:2px}
      .bil-chal-item .tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:#3a2a52;white-space:nowrap}
      .bil-status{min-height:20px;font-size:13px;opacity:.85;margin-top:10px}
      .bil-face{position:relative;width:36px;height:40px;flex:0 0 auto}
      .bil-face .hat{position:absolute;left:4px;top:0;width:28px;height:16px;clip-path:polygon(50% 0,100% 100%,0 100%)}
      .bil-face .brim{position:absolute;left:0;top:14px;width:36px;height:4px;border-radius:2px}
      .bil-face .skin{position:absolute;left:7px;top:16px;width:22px;height:20px;border-radius:50%}
      .bil-face .beard{position:absolute;left:6px;top:28px;width:24px;height:12px;border-radius:0 0 50% 50%}
      /* Desktop (a fine pointer and room to spare): keep the HUD to the corners and centre instead of stretching a phone column across the screen. */
      @media (min-width:900px) and (pointer:fine){
        .bil-top{justify-content:center;gap:16px;padding:18px 24px 0}
        .bil-seat{flex:0 1 320px;max-width:320px;padding:8px 16px 8px 8px;background:rgba(20,12,30,.8);box-shadow:0 6px 18px rgba(0,0,0,.35)}
        .bil-seat .nm{font-size:16px}
        .bil-seat .sub{font-size:13px}
        .bil-face{transform:scale(1.15);transform-origin:left center;margin-right:4px}
        .bil-power{bottom:112px;width:380px;height:18px}
        .bil-emotes{bottom:96px;gap:10px}
        .bil-msg{left:50%;right:auto;transform:translateX(-50%);width:min(760px,70vw);bottom:76px;font-size:18px}
        .bil-bar{left:auto;right:24px;bottom:20px;width:auto;gap:10px;padding:0;justify-content:flex-end}
        .bil-bar>span{display:none}
        .bil-btn{min-height:44px;padding:0 18px;background:rgba(58,42,82,.92);transition:background .15s,transform .05s}
        .bil-btn:hover{background:#4d3870}
        .bil-btn.primary:hover{background:#37a24a}
        .bil-btn:active{transform:translateY(1px)}
        .bil-btn:focus-visible{outline:2px solid #ffd54f;outline-offset:2px}
        .bil-emote{min-height:40px}
        .bil-overlay{background:rgba(10,6,18,.78)}
        .bil-card{max-width:600px;padding:24px 28px;border-radius:18px}
        .bil-card h1{font-size:30px}
        .bil-card p{font-size:15px;margin:8px 0 14px}
        .bil-card .row:not(.inline){display:grid;grid-template-columns:1fr 1fr;gap:10px}
        .bil-card .row:not(.inline)>.bil-btn{min-height:48px}
        .bil-card .row:not(.inline)>.bil-btn:first-child{grid-column:1 / -1}
        .bil-card .row.inline{margin-top:12px}
        .bil-card input[type=text],.bil-card input:not([type]){min-height:46px;font-size:16px;background:#fff}
        .bil-card .row.inline .bil-btn{min-width:110px}
        .bil-status{font-size:14px;min-height:22px}
        .bil-fine-row{bottom:118px}
        .bil-pills.five{grid-template-columns:repeat(5,1fr)}
        .bil-bubble.left{left:calc(50% - 330px)}
        .bil-bubble.right{right:calc(50% - 330px)}
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas><div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
