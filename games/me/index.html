<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Your Gnome</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        background: #121417;
        color: #e8e8e8;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      body {
        box-sizing: border-box;
        min-height: 100vh;
        padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      }
      #me {
        box-sizing: border-box;
        width: 100%;
        max-width: 480px;
        margin: 0 auto;
        overflow-wrap: anywhere;
      }
      h1 { font-size: 1.6rem; margin: 8px 0 16px; }
      p { margin: 0 0 12px; line-height: 1.45; }
      a { color: #8fb3ff; }
      .back, .link {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        font-size: 16px;
      }
      .card {
        background: #1d2127;
        border: 1px solid #2c323b;
        border-radius: 12px;
        padding: 16px;
        margin: 0 0 16px;
      }
      .name { font-size: 1.4rem; font-weight: 600; margin: 0 0 4px; }
      .muted { color: #9aa3ad; }
      .notice { color: #f0c36d; }
      .msg { min-height: 1.45em; margin: 8px 0 0; }
      .msg.error, #me [role="alert"] { color: #ff8a80; }
      .msg.ok { color: #8fd694; }
      label { display: block; margin: 0 0 6px; color: #9aa3ad; }
      input {
        box-sizing: border-box;
        display: block;
        width: 100%;
        min-height: 44px;
        font: inherit;
        font-size: 16px;
        padding: 0 12px;
        border-radius: 10px;
        border: 1px solid #2c323b;
        background: #121417;
        color: #e8e8e8;
        margin: 0 0 12px;
      }
      button {
        font: inherit;
        font-size: 16px;
        min-height: 44px;
        padding: 0 16px;
        border-radius: 10px;
        border: 1px solid #2c323b;
        background: #262c35;
        color: #e8e8e8;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      button + button, .btn-row button + button { margin-left: 8px; }
      .btn-block { display: block; width: 100%; margin: 0 0 12px; }
      .btn-primary { background: #3566c4; border-color: #3566c4; color: #ffffff; }
      .danger { background: #c0392b; border-color: #c0392b; color: #ffffff; }
      details summary {
        display: flex;
        align-items: center;
        min-height: 44px;
        cursor: pointer;
        font-weight: 600;
        color: #ff8a80;
      }
      details[open] summary { margin-bottom: 8px; }
    </style>
  </head>
  <body>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
