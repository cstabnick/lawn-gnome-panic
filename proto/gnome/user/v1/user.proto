syntax = "proto3";

package gnome.user.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

// UserService: the player's account and gnome (public profile).
//
// Sign-in is Keycloak (https://auth.whalenet.dev, realm `whalenet`): the browser runs the OIDC
// authorization-code flow with PKCE against the public client `gnome-web` and sends the access
// token as `Authorization: Bearer <access_token>`. The service checks it against Keycloak's JWKS
// (issuer, expiry, `aud` contains `gnome-web`) and keys the account on the token's `sub`. Keycloak
// owns sessions, refresh and logout, so this service has no login, refresh or logout RPCs.
//
// RPCs marked [caller] need that token. RPCs marked [service] need a service credential and are
// not reachable from browsers. RPCs marked [open] need nothing.
//
// Playing never requires an account. A game with no session keeps its local gnome (localStorage,
// packages/gnome); signing in only makes that gnome follow the player to other devices.
service UserService {
  // [caller] The caller's gnome and account. The first call for a new Keycloak user creates the
  // account (`created` = true); the browser then uploads its local gnome with UpdateGnome. A call
  // while the account is ACCOUNT_STATE_PENDING_DELETION restores it (signing in during the grace
  // period cancels the deletion).
  rpc GetMe(GetMeRequest) returns (GetMeResponse);

  // [caller] Change display name or look. Names go through the same rules as online play
  // (checkName in packages/mp/src/textFilter.ts); a rejected name is INVALID_ARGUMENT.
  rpc UpdateGnome(UpdateGnomeRequest) returns (UpdateGnomeResponse);

  // [caller] Delete the account. Data is purged at `purge_at` (grace period for "I didn't mean
  // it"); signing in before then restores it. The Keycloak user itself is not deleted here.
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);

  // [open] Public gnomes by id, for showing other players in a match. At most 32 ids.
  rpc BatchGetGnomes(BatchGetGnomesRequest) returns (BatchGetGnomesResponse);

  // [open] Not implemented yet (UNIMPLEMENTED): server-side guests, for when unlocks need an
  // account before sign-in. Until then the local gnome is the guest.
  rpc CreateGuest(CreateGuestRequest) returns (CreateGuestResponse);

  // [service] Not implemented yet (UNIMPLEMENTED): lets mp-server check a player's token at
  // queue time. Services may verify Keycloak tokens locally against the JWKS instead.
  rpc VerifyToken(VerifyTokenRequest) returns (VerifyTokenResponse);
}

// ---------------------------------------------------------------------------------------------
// Resources
// ---------------------------------------------------------------------------------------------

// The public face of a player. Anyone can read it. One gnome per account for now, so user_id
// identifies both.
message Gnome {
  // Server-assigned, opaque, never changes. Used as the key by every other service.
  string user_id = 1;
  // Shown in games. Not unique. Same rules as the online name today.
  string display_name = 2;
  // Unique and server-assigned, e.g. "mossy-boots-4821". Unused in v1; reserved so a future social
  // service can look players up without exposing user_id.
  string handle = 3;
  // Base look that every gnome has for free. Cosmetic items (inventory service) draw on top of it.
  GnomeLook look = 4;
  google.protobuf.Timestamp created_at = 5;
}

// A gnome's colours and features, 0xRRGGBB palette colours (packages/gnome/src/look.ts). Its JSON
// is exactly packages/gnome's `Look` (hatRgb, coatRgb, ...). A game that cannot show a field ignores it.
message GnomeLook {
  uint32 hat_rgb = 1;
  // Beard colour; absent = no beard.
  optional uint32 beard_rgb = 2;
  uint32 skin_rgb = 3;
  // The shirt (a dress skirt, too).
  uint32 coat_rgb = 4;
  uint32 pants_rgb = 5;
  uint32 boots_rgb = 6;
  // Pigtail hair colour; absent = no hair showing under the hat.
  optional uint32 hair_rgb = 7;
  bool freckles = 8;
  bool dress = 9;
  bool glasses = 10;
  // Equipped @lawn/prefabs ids by slot ("head", "back", "neck", "hand").
  map<string, string> equipment = 11;
  // Hair style id (packages/gnome HAIR_STYLES: "ponytail", "bun", ...); absent = pigtails. Bought in Club Gnome's salon.
  optional string hair_style = 12;
}

// Private to its owner.
message Account {
  string user_id = 1;
  AccountState state = 2;
  // Was `identities`: Keycloak owns linked identities now.
  reserved 3;
  reserved "identities";
  google.protobuf.Timestamp created_at = 4;
  // Set while state is ACCOUNT_STATE_PENDING_DELETION.
  google.protobuf.Timestamp purge_at = 5;
}

enum AccountState {
  ACCOUNT_STATE_UNSPECIFIED = 0;
  // Made by CreateGuest (not implemented yet).
  ACCOUNT_STATE_GUEST = 1;
  // Belongs to a Keycloak user; can sign in from any device.
  ACCOUNT_STATE_LINKED = 2;
  // DeleteAccount was called; purged at Account.purge_at.
  ACCOUNT_STATE_PENDING_DELETION = 3;
}

// ---------------------------------------------------------------------------------------------
// Requests and responses
// ---------------------------------------------------------------------------------------------

message CreateGuestRequest {
  // Optional; a random gnome name is picked when empty.
  string display_name = 1;
  // Optional; random colours when unset.
  GnomeLook look = 2;
}

message CreateGuestResponse {
  Gnome gnome = 1;
}

message GetMeRequest {}

message GetMeResponse {
  Gnome gnome = 1;
  Account account = 2;
  // True when this call created the account (first sign-in).
  bool created = 3;
}

message UpdateGnomeRequest {
  // Only `display_name` and `look` may be in the mask (paths "display_name", "look"); `look` is
  // replaced whole. An empty mask is INVALID_ARGUMENT.
  Gnome gnome = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateGnomeResponse {
  Gnome gnome = 1;
}

message DeleteAccountRequest {
  // Must equal the caller's handle; a guard against accidental calls.
  string confirm_handle = 1;
}

message DeleteAccountResponse {
  google.protobuf.Timestamp purge_at = 1;
}

message BatchGetGnomesRequest {
  repeated string user_ids = 1;
}

message BatchGetGnomesResponse {
  // Unknown or deleted ids are left out; order is not guaranteed.
  repeated Gnome gnomes = 1;
}

message VerifyTokenRequest {
  string access_token = 1;
}

message VerifyTokenResponse {
  string user_id = 1;
  AccountState state = 2;
  google.protobuf.Timestamp expires_at = 3;
}
